<head>
  {% if page.collection == "releases" %}{% assign release_meta = page %}{% endif %}
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>
    {% if release_meta %}{{ release_meta.title }} · {% elsif page.title %}{{ page.title }} · {% endif %}{{ site.title }}
  </title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bonheur+Royale&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/reveal.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/typography.css' | relative_url }}" />
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
